# Production. Uploaded as compose.yml by .github/workflows/deploy.yml, next to a
# .env generated from the `production` GitHub environment (${VAR} values below).
# Requires the external Traefik network `proxy`.

# Inherited from the old setup-production repo: container, network and DB volume
# names derive from it. Changing it would recreate everything on an empty database.
name: setup-production

services:
  frontend:
    image: ghcr.io/cleanwalk-org-asso/cleanwalk-org-v2/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    depends_on:
      - api
    environment:
      NUXT_PUBLIC_API_URL: https://${API_DOMAIN:?API_DOMAIN is required}
      NUXT_API_INTERNAL_URL: http://api:8080
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.cleanwalk-front.rule=Host(`${FRONT_DOMAIN:?FRONT_DOMAIN is required}`) || Host(`www.${FRONT_DOMAIN}`)"
      # 301 from www.<domain> to <domain> (canonical, as in the sitemap and og:url).
      # Keep no www redirect rule in Cloudflare, or the two would loop.
      - "traefik.http.routers.cleanwalk-front.middlewares=cleanwalk-www-redirect"
      - "traefik.http.middlewares.cleanwalk-www-redirect.redirectregex.regex=^https?://www\\.(.+)"
      - "traefik.http.middlewares.cleanwalk-www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.cleanwalk-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.cleanwalk-front.entrypoints=websecure"
      - "traefik.http.routers.cleanwalk-front.tls.certresolver=letsencrypt"
      - "traefik.http.services.cleanwalk-front.loadbalancer.server.port=80"
      - "traefik.http.services.cleanwalk-front.loadbalancer.server.scheme=http"

    networks:
      - proxy
      - internal
    restart: always

  api:
    image: ghcr.io/cleanwalk-org-asso/cleanwalk-org-v2/api:${IMAGE_TAG:?IMAGE_TAG is required}
    # The API runs `prisma migrate deploy` on startup.
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_URL: https://${FRONT_DOMAIN:?FRONT_DOMAIN is required}
      CALLBACK_URL: https://${API_DOMAIN:?API_DOMAIN is required}/auth/login/google/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.cleanwalk-api.rule=Host(`${API_DOMAIN:?API_DOMAIN is required}`)"
      - "traefik.http.routers.cleanwalk-api.entrypoints=websecure"
      - "traefik.http.routers.cleanwalk-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.cleanwalk-api.loadbalancer.server.port=8080"
      - "traefik.http.services.cleanwalk-api.loadbalancer.server.scheme=http"

    networks:
      - proxy
      - internal
    restart: always

  database:
    image: postgres:18-alpine
    # Only used to initialise a new volume: must match the existing database.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      # Postgres 18+ keeps its data in /var/lib/postgresql/18/docker and refuses
      # to start with a volume mounted on /var/lib/postgresql/data.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal
    restart: always

  redis:
    image: redis:8-alpine
    networks:
      - internal
    restart: always

  # One-off: `docker compose run --rm db_backup` (backup crons and every deploy).
  db_backup:
    image: ghcr.io/cleanwalk-org-asso/db-backup-cw/backup:latest
    profiles:
      - db_backup
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${BACKUP_S3_BUCKET_NAME}
      S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL}
      BACKUP_PREFIX: backups/daily
      GPG_PASSPHRASE: ${BACKUP_GPG_PASSPHRASE}
      WEBHOOK_URL: ${BACKUP_WEBHOOK_URL}
    networks:
      - internal

volumes:
  db_data:
    # Explicit so the database keeps its volume whatever the project name.
    name: setup-production_db_data

networks:
  proxy:
    external: true
  internal:
    driver: bridge
