name: Deploy (réutilisable)

# Appelé par ci-cd.yml (staging sur main, prod sur tag) et rollback.yml.
# Sur le serveur, le dossier de setup (compose.yml + .env) est un clone git :
# on le met à jour, on sauvegarde la base, puis on tire les images `latest`
# (`frontend-recette`/`api-recette` en staging, `frontend`/`api` en prod)
# et on relance les conteneurs.
#
# À configurer dans chaque environment GitHub (`staging` et `production`,
# Settings > Environments) :
#   secrets   SERVER_SSH_KEY_B64 --> clé privée autorisée sur le serveur, encodée
#                                    en base64 (`base64 -w0 ~/.ssh/cle`)
#             SERVER_HOST        --> IP ou domaine du serveur
#   variables SERVER_USER        --> utilisateur SSH
#             SERVER_PORT        --> port SSH (22 si vide)
# Au niveau du repo :
#   secret    GHRCTOKEN --> PAT pour tirer les images de ghcr.io
#   variable  GHRCUSER  --> propriétaire du PAT

on:
  workflow_call:
    inputs:
      environment:
        description: "staging ou production"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Un seul déploiement à la fois par environnement (tag + rollback simultanés par ex.).
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ vars.SERVER_USER }}
      PORT: ${{ vars.SERVER_PORT || '22' }}
    steps:
      - name: Vérifier l'environnement
        run: |
          case "${{ inputs.environment }}" in
            staging|production) ;;
            *) echo "Environnement inconnu : ${{ inputs.environment }}"; exit 1 ;;
          esac

      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Déployer
        env:
          SETUP_DIR: ${{ inputs.environment == 'production' && 'cleanwalk-v2/setup-production' || 'setup-production' }}
          # Branche du repo de setup sur le serveur de staging (ancien nom gardé).
          SETUP_BRANCH: ${{ inputs.environment == 'production' && 'main' || 'recette' }}
          GHCR_USER: ${{ vars.GHRCUSER }}
          GHCR_TOKEN: ${{ secrets.GHRCTOKEN }}
        # Le script passe par stdin (bash -s) : le token n'apparaît pas dans
        # la ligne de commande du serveur.
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" bash -s <<EOF
          set -euo pipefail
          cd "\$HOME/$SETUP_DIR"
          docker compose run --rm -e BACKUP_PREFIX=backups/pre-deploy db_backup
          git pull origin "$SETUP_BRANCH"
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker compose -f compose.yml pull
          docker compose -f compose.yml up -d --remove-orphans
          docker image prune -f
          EOF
