name: Deploy (réutilisable)

# Appelé par ci-cd.yml (recette sur main, prod sur tag) et rollback.yml.
# Sur le serveur, le dossier de setup (compose.yml + .env) est un clone git :
# on le met à jour, on sauvegarde la base, puis on tire les images `latest`
# (`frontend-recette`/`api-recette` en recette, `frontend`/`api` en prod)
# et on relance les conteneurs.
#
# Secrets requis :
#   SERVER_HOST / SERVER_USER / SERVER_SSH_KEY / SERVER_PORT                 --> prod
#   SERVER_HOST_DEV / SERVER_USER_DEV / SERVER_SSH_KEY_DEV / SERVER_PORT_DEV --> recette
#   ghrcToken / ghrcUser --> PAT pour tirer les images de ghcr.io

on:
  workflow_call:
    inputs:
      environment:
        description: "recette ou production"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Un seul déploiement à la fois par environnement (tag + rollback simultanés par ex.).
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Vérifier l'environnement
        run: |
          case "${{ inputs.environment }}" in
            recette|production) ;;
            *) echo "Environnement inconnu : ${{ inputs.environment }}"; exit 1 ;;
          esac

      - name: Préparer la connexion SSH
        env:
          SSH_KEY: ${{ inputs.environment == 'production' && secrets.SERVER_SSH_KEY || secrets.SERVER_SSH_KEY_DEV }}
          HOST: ${{ inputs.environment == 'production' && secrets.SERVER_HOST || secrets.SERVER_HOST_DEV }}
          PORT: ${{ inputs.environment == 'production' && secrets.SERVER_PORT || secrets.SERVER_PORT_DEV }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Déployer
        env:
          HOST: ${{ inputs.environment == 'production' && secrets.SERVER_HOST || secrets.SERVER_HOST_DEV }}
          USER: ${{ inputs.environment == 'production' && secrets.SERVER_USER || secrets.SERVER_USER_DEV }}
          PORT: ${{ inputs.environment == 'production' && secrets.SERVER_PORT || secrets.SERVER_PORT_DEV }}
          SETUP_DIR: ${{ inputs.environment == 'production' && 'cleanwalk-v2/setup-production' || 'setup-production' }}
          SETUP_BRANCH: ${{ inputs.environment == 'production' && 'main' || 'recette' }}
          GHCR_USER: ${{ secrets.ghrcUser }}
          GHCR_TOKEN: ${{ secrets.ghrcToken }}
        # Le script passe par stdin (bash -s) : le token n'apparaît pas dans
        # la ligne de commande du serveur.
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" "$USER@$HOST" bash -s <<EOF
          set -euo pipefail
          cd "\$HOME/$SETUP_DIR"
          docker compose run --rm -e BACKUP_PREFIX=backups/pre-deploy db_backup
          git pull origin "$SETUP_BRANCH"
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker compose -f compose.yml pull
          docker compose -f compose.yml up -d --remove-orphans
          docker image prune -f
          EOF
