name: Deploy (reusable)

# Called by ci-cd.yml and rollback.yml. Copies compose.<env>.yml to the server as
# compose.yml next to a .env generated from the GitHub environment, backs up the
# database, then pulls and restarts. A plain `docker compose ...` on the server
# (backup crons included) therefore uses the last deploy's config.
#
# GitHub environment settings (`staging` and `production`):
#   secrets    SERVER_HOST, SERVER_SSH_KEY_B64 (private key, `base64 -w0`),
#              POSTGRES_PASSWORD, JWT_SECRET, GOOGLE_CLIENT_SECRET,
#              S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, SMTP_PASS,
#              BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY,
#              BACKUP_GPG_PASSPHRASE, BACKUP_WEBHOOK_URL
#   variables  SERVER_USER, SERVER_PORT (default 22),
#              DEPLOY_PATH (absolute, must already exist),
#              FRONT_DOMAIN, API_DOMAIN (host names only, no www. or https://),
#              POSTGRES_USER, POSTGRES_DB, GOOGLE_CLIENT_ID,
#              S3_ENDPOINT, S3_BUCKET, S3_PUBLIC_URL, SMTP_HOST, SMTP_PORT, SMTP_USER,
#              BACKUP_S3_ENDPOINT_URL, BACKUP_S3_BUCKET_NAME
# Repo level: secret GHRCTOKEN, variable GHRCUSER.

on:
  workflow_call:
    inputs:
      environment:
        description: "staging or production"
        required: true
        type: string
      image_tag:
        description: "frontend and api image tag (commit SHA or vX.Y.Z)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ vars.SERVER_USER }}
      PORT: ${{ vars.SERVER_PORT || '22' }}
      COMPOSE_FILE: ${{ inputs.environment == 'production' && 'compose.prod.yml' || 'compose.staging.yml' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Check environment
        run: |
          case "${{ inputs.environment }}" in
            staging|production) ;;
            *) echo "Unknown environment: ${{ inputs.environment }}"; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload compose.yml and .env
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          FRONT_DOMAIN: ${{ vars.FRONT_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BACKUP_S3_ENDPOINT_URL: ${{ vars.BACKUP_S3_ENDPOINT_URL }}
          BACKUP_S3_BUCKET_NAME: ${{ vars.BACKUP_S3_BUCKET_NAME }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          BACKUP_WEBHOOK_URL: ${{ secrets.BACKUP_WEBHOOK_URL }}
        run: |
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "::error::DEPLOY_PATH must be an absolute path (got '$DEPLOY_PATH')"; exit 1 ;;
          esac
          if ! ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" test -d "'$DEPLOY_PATH'"; then
            echo "::error::$DEPLOY_PATH does not exist on the server"
            exit 1
          fi

          # The backup script refuses to start without any of the BACKUP_* values.
          for name in FRONT_DOMAIN API_DOMAIN POSTGRES_USER POSTGRES_DB POSTGRES_PASSWORD JWT_SECRET \
            BACKUP_S3_ENDPOINT_URL BACKUP_S3_BUCKET_NAME BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY \
            BACKUP_GPG_PASSPHRASE BACKUP_WEBHOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing from the ${{ inputs.environment }} environment"
              exit 1
            fi
          done

          uri() { jq -rn --arg v "$1" '$v | @uri'; }
          DATABASE_URL="postgresql://$(uri "$POSTGRES_USER"):$(uri "$POSTGRES_PASSWORD")@database:5432/$(uri "$POSTGRES_DB")"

          # Single-quoted so compose reads values literally; a quote or newline would break the file.
          umask 077
          : > deploy.env
          for name in IMAGE_TAG FRONT_DOMAIN API_DOMAIN DATABASE_URL POSTGRES_USER POSTGRES_DB POSTGRES_PASSWORD JWT_SECRET \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET S3_ENDPOINT S3_BUCKET S3_PUBLIC_URL S3_ACCESS_KEY_ID \
            S3_SECRET_ACCESS_KEY SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS BACKUP_S3_ENDPOINT_URL \
            BACKUP_S3_BUCKET_NAME BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY BACKUP_GPG_PASSPHRASE \
            BACKUP_WEBHOOK_URL; do
            value="${!name}"
            case "$value" in
              *"'"*|*$'\n'*)
                echo "::error::$name contains a single quote or a newline"
                exit 1 ;;
            esac
            printf "%s='%s'\n" "$name" "$value" >> deploy.env
          done

          scp -p -i ~/.ssh/id_deploy -P "$PORT" "$COMPOSE_FILE" "$USER@$HOST:$DEPLOY_PATH/compose.yml"
          scp -p -i ~/.ssh/id_deploy -P "$PORT" deploy.env "$USER@$HOST:$DEPLOY_PATH/.env"

      - name: Deploy
        env:
          GHCR_USER: ${{ vars.GHRCUSER }}
          GHCR_TOKEN: ${{ secrets.GHRCTOKEN }}
        # Script sent on stdin so the token stays off the remote command line.
        # { ... } </dev/null: bash reads the whole block first, so `docker compose run`
        # cannot swallow the rest of the script from stdin.
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" bash -s <<EOF
          {
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # No logout: the backup crons must be able to re-pull the private db-backup-cw image.
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          # No volume yet means a first deploy: nothing to back up. Otherwise make sure
          # the database is up, since `run` does not start it.
          if docker volume inspect setup-production_db_data >/dev/null 2>&1; then
            docker compose up -d --wait database
            docker compose run --rm -e BACKUP_PREFIX=backups/pre-deploy db_backup
          else
            echo "No setup-production_db_data volume: first deploy, skipping the pre-deploy backup"
          fi
          docker compose pull
          docker compose up -d --remove-orphans
          # Every deploy has its own image tag: drop unused images older than a week.
          docker image prune -af --filter "until=168h"
          } </dev/null
          EOF
